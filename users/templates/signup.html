<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body>
    <h1>Create an Account</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Sign Up</button>
    </form>
    <p style="margin-top: 16px;">
        Already have an account? <a href="/login/">Log in</a>
    </p>
</body>
</html>
